<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MeetUp – Video Calling</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#0f1218;--panel:#181c25;--tile:#1f2430;--text:#e9ecf3;--muted:#8b93a7;--accent:#4c8dff;--danger:#e5484d;--ok:#30c48d;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{font:inherit;color:inherit}
[hidden]{display:none!important}

/* ---------- Lobby ---------- */
#lobby{height:100dvh;overflow:auto;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:880px;background:var(--panel);border-radius:20px;padding:24px;display:grid;grid-template-columns:1.1fr 1fr;gap:24px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
@media(max-width:760px){.card{grid-template-columns:1fr}}
.preview{position:relative;aspect-ratio:16/9;background:var(--tile);border-radius:var(--radius);overflow:hidden;display:flex;align-items:center;justify-content:center}
.preview video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.preview .off{position:relative;color:var(--muted);font-size:14px}
.preview .pv-ctrl{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:2}
.round{width:46px;height:46px;border-radius:50%;background:#2b3140;font-size:20px;display:flex;align-items:center;justify-content:center;transition:.15s}
.round:hover{background:#363d50}
.round.off{background:var(--danger)}
.round:disabled{opacity:.4;cursor:not-allowed}
.form h1{font-size:26px;margin-bottom:4px}
.form p.sub{color:var(--muted);font-size:14px;margin-bottom:18px}
.form label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
.form input[type=text]{width:100%;padding:12px 14px;border-radius:10px;background:var(--tile);border:1px solid #2b3140;outline:none}
.form input[type=text]:focus{border-color:var(--accent)}
.tabs{display:flex;background:var(--tile);border-radius:10px;padding:4px;margin-top:14px}
.tabs button{flex:1;padding:9px;border-radius:8px;font-size:14px;color:var(--muted)}
.tabs button.active{background:var(--accent);color:#fff}
.primary{width:100%;margin-top:18px;padding:13px;border-radius:10px;background:var(--accent);color:#fff;font-weight:600}
.primary:disabled{opacity:.5;cursor:wait}
#status{min-height:20px;margin-top:12px;font-size:13px;color:var(--muted)}
#status.err{color:#ff7b80}
.note{margin-top:10px;font-size:12px;color:var(--muted);line-height:1.5}

/* ---------- Room ---------- */
#room{height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);flex-wrap:wrap}
header .logo{font-weight:700;margin-right:6px}
.pill{background:#2b3140;border-radius:999px;padding:6px 12px;font-size:13px;display:flex;align-items:center;gap:6px}
.pill button{font-size:13px;color:var(--accent)}
.sp{flex:1}
main{flex:1;display:flex;min-height:0}
.stage{flex:1;display:flex;flex-direction:column;gap:8px;padding:8px;min-width:0;min-height:0}
#pinArea{flex:1;min-height:0;display:flex}
#pinArea:empty{display:none}
#pinArea .tile{flex:1}
#grid{flex:1;min-height:0;display:grid;gap:8px}
.has-pin #grid{flex:none;height:120px;display:flex;overflow-x:auto}
.has-pin #grid .tile{flex:0 0 200px}
.tile{position:relative;background:var(--tile);border-radius:var(--radius);overflow:hidden;min-height:0;min-width:0;border:2px solid transparent;transition:border-color .15s;cursor:pointer}
.tile.speaking{border-color:var(--ok)}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.tile.mirror video{transform:scaleX(-1)}
.tile.screen video{object-fit:contain}
.tile .avatar{position:absolute;inset:0;background:var(--tile);display:none;align-items:center;justify-content:center}
.tile.nocam .avatar{display:flex}
.avatar span{width:25%;min-width:48px;max-width:96px;aspect-ratio:1;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:clamp(20px,4vw,38px);font-weight:600;text-transform:uppercase}
.label{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);padding:4px 9px;border-radius:8px;font-size:13px;display:flex;gap:6px;max-width:85%}
.label .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.label .mic{display:none}
.tile.muted .label .mic{display:inline}
.badge{position:absolute;top:8px;left:8px;background:var(--accent);padding:3px 9px;border-radius:8px;font-size:12px;display:none}
.tile.screen .badge{display:block}
.pinicon{position:absolute;top:8px;right:8px;font-size:14px;display:none}
.tile.pinned .pinicon{display:block}
aside{width:320px;background:var(--panel);display:flex;flex-direction:column;border-left:1px solid #2b3140}
aside h3{padding:14px;font-size:15px;border-bottom:1px solid #2b3140;display:flex;justify-content:space-between}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{font-size:14px;line-height:1.4;word-break:break-word}
.msg b{display:block;font-size:12px;color:var(--muted);font-weight:500}
.msg.me b{color:var(--accent)}
.msg.sys{color:var(--muted);font-size:12px;text-align:center}
#chatForm{display:flex;gap:8px;padding:10px;border-top:1px solid #2b3140}
#chatForm input{flex:1;padding:10px 12px;border-radius:10px;background:var(--tile);border:1px solid #2b3140;outline:none;min-width:0}
#chatForm button{background:var(--accent);color:#fff;border-radius:10px;padding:0 14px}
@media(max-width:760px){aside{position:fixed;inset:0;width:100%;z-index:20}}
.controls{display:flex;justify-content:center;gap:12px;padding:12px;background:var(--panel);flex-wrap:wrap}
.ctl{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.ctl .round{position:relative}
.ctl.on .round{background:var(--accent)}
.ctl .dot{position:absolute;top:-2px;right:-2px;background:var(--danger);border-radius:999px;font-size:10px;min-width:16px;height:16px;display:none;align-items:center;justify-content:center;color:#fff}
.leave .round{background:var(--danger);border-radius:24px;width:62px}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#2b3140;padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:.25s}
#toast.show{opacity:1}
</style>
</head>
<body>

<!-- ================= LOBBY ================= -->
<div id="lobby">
  <div class="card">
    <div>
      <div class="preview">
        <video id="pvVideo" autoplay muted playsinline></video>
        <span class="off" id="pvOff" hidden>Camera is off</span>
        <div class="pv-ctrl">
          <button class="round" id="pvMic" title="Microphone">🎤</button>
          <button class="round" id="pvCam" title="Camera">🎥</button>
        </div>
      </div>
      <p class="note" id="mediaNote"></p>
    </div>
    <div class="form">
      <h1>MeetUp</h1>
      <p class="sub">Video calls for up to 10 people. Audio, video and screen sharing.</p>
      <label for="name">Your name</label>
      <input type="text" id="name" maxlength="24" placeholder="Enter your name" autocomplete="off">
      <div class="tabs">
        <button id="tabCreate" class="active">Create room</button>
        <button id="tabJoin">Join room</button>
      </div>
      <div id="joinBox" hidden>
        <label for="code">Room code</label>
        <input type="text" id="code" maxlength="8" placeholder="e.g. k7m2xq" autocomplete="off">
      </div>
      <button class="primary" id="goBtn">Start meeting</button>
      <div id="status"></div>
      <p class="note">Create a room, then share the code (or invite link) with others. Everyone connects directly to each other (peer-to-peer).</p>
    </div>
  </div>
</div>

<!-- ================= ROOM ================= -->
<div id="room" hidden>
  <header>
    <span class="logo">MeetUp</span>
    <span class="pill">Room: <b id="roomCode"></b> <button id="copyCode">Copy code</button> <button id="copyLink">Copy link</button></span>
    <span class="pill">👥 <span id="count">1</span>/10</span>
    <span class="sp"></span>
    <span class="pill" id="timer">00:00</span>
  </header>
  <main>
    <div class="stage" id="stage">
      <div id="pinArea"></div>
      <div id="grid"></div>
    </div>
    <aside id="chat" hidden>
      <h3>Chat <button id="closeChat">✕</button></h3>
      <div id="msgs"></div>
      <form id="chatForm"><input id="chatInput" placeholder="Type a message…" autocomplete="off" maxlength="500"><button>Send</button></form>
    </aside>
  </main>
  <div class="controls">
    <div class="ctl" id="ctlMic"><button class="round" id="btnMic">🎤</button>Mute</div>
    <div class="ctl" id="ctlCam"><button class="round" id="btnCam">🎥</button>Camera</div>
    <div class="ctl" id="ctlShare"><button class="round" id="btnShare">🖥️</button>Share screen</div>
    <div class="ctl" id="ctlChat"><button class="round" id="btnChat">💬<span class="dot" id="unread">0</span></button>Chat</div>
    <div class="ctl leave"><button class="round" id="btnLeave">📞</button>Leave</div>
  </div>
</div>
<div id="toast"></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const MAX=10;
const ICE=[
  {urls:'stun:stun.l.google.com:19302'},
  {urls:'stun:stun1.l.google.com:19302'},
  {urls:'stun:global.stun.twilio.com:3478'},
  {urls:['turn:openrelay.metered.ca:80','turn:openrelay.metered.ca:443','turn:openrelay.metered.ca:443?transport=tcp'],username:'openrelayproject',credential:'openrelayproject'}
];

/* ---------- state ---------- */
let peer=null,myId=null,roomCode='',hostId='',isHost=false,hosting=false,joined=false,joinTimer=null;
let myName='Guest';
let camTrack=null,micTrack=null,screenTrack=null,hasCam=false,hasMic=false,sendStream=null;
const state={mic:true,cam:true,sharing:false};
const parts=new Map();
const me={id:'me',name:'You',mic:true,cam:true,sharing:false};
let pinned=null,autoPinned=false;

/* ---------- helpers ---------- */
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2600)}
function setStatus(t,err){const s=$('#status');s.textContent=t||'';s.className=err?'err':''}
function genCode(){const a='abcdefghjkmnpqrstuvwxyz23456789';let c='';for(let i=0;i<6;i++)c+=a[Math.floor(Math.random()*a.length)];return c}
function gum(c){return navigator.mediaDevices&&navigator.mediaDevices.getUserMedia?navigator.mediaDevices.getUserMedia(c):Promise.reject(new Error('unsupported'))}
function dummyVideo(){const c=document.createElement('canvas');c.width=640;c.height=360;const g=c.getContext('2d');const d=()=>{g.fillStyle='#1f2430';g.fillRect(0,0,640,360)};d();setInterval(d,1000);return c.captureStream(1).getVideoTracks()[0]}
function dummyAudio(){const ac=new (window.AudioContext||window.webkitAudioContext)();return ac.createMediaStreamDestination().stream.getAudioTracks()[0]}

/* ---------- media init ---------- */
async function initMedia(){
  let s=null;
  try{s=await gum({video:{width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}},audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}
  catch(e){
    try{s=await gum({audio:true})}catch(e2){try{s=await gum({video:true})}catch(e3){}}
  }
  if(s){
    const v=s.getVideoTracks()[0],a=s.getAudioTracks()[0];
    if(v){camTrack=v;hasCam=true}
    if(a){micTrack=a;hasMic=true}
  }
  if(!camTrack){camTrack=dummyVideo();camTrack.enabled=false;state.cam=false}
  if(!micTrack){micTrack=dummyAudio();state.mic=false}
  sendStream=new MediaStream([micTrack,camTrack]);
  const notes=[];
  if(!hasCam)notes.push('No camera available – you will join without video.');
  if(!hasMic)notes.push('No microphone available – you will join without audio.');
  if(!hasCam&&!hasMic)notes.push('Allow camera/microphone access (needs https or localhost) and reload if you want to be seen/heard.');
  $('#mediaNote').textContent=notes.join(' ');
  $('#pvVideo').srcObject=new MediaStream([camTrack]);
  syncButtons();
}
function syncButtons(){
  $('#pvMic').classList.toggle('off',!state.mic);$('#pvMic').textContent=state.mic?'🎤':'🔇';$('#pvMic').disabled=!hasMic;
  $('#pvCam').classList.toggle('off',!state.cam);$('#pvCam').textContent=state.cam?'🎥':'🚫';$('#pvCam').disabled=!hasCam;
  $('#pvOff').hidden=state.cam;
  $('#btnMic').classList.toggle('off',!state.mic);$('#btnMic').textContent=state.mic?'🎤':'🔇';$('#btnMic').disabled=!hasMic;
  $('#btnCam').classList.toggle('off',!state.cam);$('#btnCam').textContent=state.cam?'🎥':'🚫';$('#btnCam').disabled=!hasCam;
  $('#ctlMic').lastChild.textContent=state.mic?'Mute':'Unmute';
  $('#ctlCam').lastChild.textContent=state.cam?'Stop video':'Start video';
  $('#ctlShare').classList.toggle('on',state.sharing);
  $('#ctlShare').lastChild.textContent=state.sharing?'Stop share':'Share screen';
  me.mic=state.mic;me.cam=state.cam;me.sharing=state.sharing;
  if(me.tile)updateTile(me);
}
function toggleMic(){if(!hasMic)return;micTrack.enabled=!micTrack.enabled;state.mic=micTrack.enabled;syncButtons();broadcast(hello())}
function toggleCam(){if(!hasCam)return;camTrack.enabled=!camTrack.enabled;state.cam=camTrack.enabled;syncButtons();broadcast(hello())}
$('#pvMic').onclick=toggleMic;$('#pvCam').onclick=toggleCam;
$('#btnMic').onclick=toggleMic;$('#btnCam').onclick=toggleCam;

/* ---------- lobby ---------- */
let mode='create';
function setMode(m){mode=m;$('#tabCreate').classList.toggle('active',m==='create');$('#tabJoin').classList.toggle('active',m==='join');$('#joinBox').hidden=m!=='join';$('#goBtn').textContent=m==='create'?'Start meeting':'Join meeting'}
$('#tabCreate').onclick=()=>setMode('create');
$('#tabJoin').onclick=()=>setMode('join');
const h=location.hash.replace('#','').trim();
if(h){setMode('join');$('#code').value=h}
try{$('#name').value=localStorage.getItem('meetup-name')||''}catch(e){}

$('#goBtn').onclick=()=>{
  myName=($('#name').value.trim()||'Guest').slice(0,24);
  try{localStorage.setItem('meetup-name',myName)}catch(e){}
  me.name=myName;
  $('#goBtn').disabled=true;
  if(mode==='create'){setStatus('Creating room…');startHost()}
  else{
    const c=$('#code').value.trim().toLowerCase();
    if(c.length<4){setStatus('Enter a valid room code.',true);$('#goBtn').disabled=false;return}
    setStatus('Joining room…');startJoin(c);
  }
};
function fail(msg){
  clearTimeout(joinTimer);
  try{peer&&peer.destroy()}catch(e){}
  peer=null;joined=false;hosting=false;isHost=false;
  [...parts.keys()].forEach(removePart);
  $('#room').hidden=true;$('#lobby').hidden=false;
  $('#goBtn').disabled=false;setStatus(msg,true);
}

/* ---------- peer setup ---------- */
function createPeer(id){
  const p=id?new Peer(id,{config:{iceServers:ICE},debug:1}):new Peer(undefined,{config:{iceServers:ICE},debug:1});
  p.on('connection',conn=>{
    if(isHost&&!parts.has(conn.peer)&&parts.size+1>=MAX){
      conn.on('open',()=>{conn.send({type:'full'});setTimeout(()=>conn.close(),600)});
      return;
    }
    const others=[...parts.keys()];
    setupConn(conn);
    if(isHost)conn.on('open',()=>conn.send({type:'peers',list:[myId,...others]}));
  });
  p.on('call',call=>{
    call.answer(sendStream);
    setupCall(call);
  });
  p.on('disconnected',()=>{try{p.reconnect()}catch(e){}});
  p.on('error',e=>{
    if(e.type==='unavailable-id'&&hosting&&!joined){try{p.destroy()}catch(x){};startHost();return}
    if(e.type==='peer-unavailable'){
      const m=/peer\s+(\S+)/.exec(e.message||'');const pid=m&&m[1];
      if(!joined&&pid===hostId)return fail('Room not found. Check the code and make sure the host is still in the call.');
      if(pid)removePart(pid);
      return;
    }
    if(!joined)return fail('Connection error ('+e.type+'). Please try again.');
    if(e.type!=='network'&&e.type!=='disconnected')toast('Connection issue: '+e.type);
  });
  return p;
}
function startHost(){
  roomCode=genCode();hostId='vc-'+roomCode;hosting=true;isHost=true;
  peer=createPeer(hostId);
  peer.on('open',id=>{myId=id;joined=true;showRoom()});
}
function startJoin(code){
  roomCode=code;hostId='vc-'+code;isHost=false;hosting=false;joined=false;
  peer=createPeer(null);
  peer.on('open',id=>{
    myId=id;
    const conn=peer.connect(hostId,{reliable:true,metadata:{name:myName}});
    setupConn(conn);
  });
  joinTimer=setTimeout(()=>{if(!joined)fail('Could not reach the room. Check the code or your network.')},15000);
}

/* ---------- participants ---------- */
function getPart(id,nm){
  let p=parts.get(id);
  if(!p){
    p={id,name:nm||'Guest',mic:true,cam:true,sharing:false,conn:null,call:null,stream:null};
    parts.set(id,p);makeTile(p,false);updateCount();
    if(joined&&nm)toast(nm+' joined');
  }else if(nm&&p.name==='Guest'){p.name=nm;updateTile(p)}
  return p;
}
function hello(){return{type:'hello',name:myName,mic:state.mic,cam:state.cam,sharing:state.sharing}}
function broadcast(m){parts.forEach(p=>{try{if(p.conn&&p.conn.open)p.conn.send(m)}catch(e){}})}

function setupConn(conn){
  const p=getPart(conn.peer,conn.metadata&&conn.metadata.name);
  p.conn=conn;
  conn.on('open',()=>conn.send(hello()));
  conn.on('data',m=>onData(p,conn,m));
  conn.on('close',()=>removePart(conn.peer));
  conn.on('error',()=>{});
}
function onData(p,conn,m){
  if(!m||typeof m!=='object')return;
  if(m.type==='hello'){
    p.name=String(m.name||'Guest').slice(0,24);p.mic=!!m.mic;p.cam=!!m.cam;
    const was=p.sharing;p.sharing=!!m.sharing;
    updateTile(p);
    if(p.sharing&&!was&&!pinned){pinned=p.id;autoPinned=true;layout()}
    if(!p.sharing&&was&&pinned===p.id&&autoPinned){pinned=null;autoPinned=false;layout()}
  }else if(m.type==='chat'){
    addChat(p.name,String(m.text||'').slice(0,500),false);
  }else if(m.type==='full'){
    fail('This room is full (maximum 10 people).');
  }else if(m.type==='peers'&&!joined){
    joined=true;clearTimeout(joinTimer);
    showRoom();
    (m.list||[]).slice(0,MAX).forEach(id=>{
      if(id===myId)return;
      if(id!==hostId&&!parts.has(id)){
        const c=peer.connect(id,{reliable:true,metadata:{name:myName}});
        setupConn(c);
      }
      callPeer(id);
    });
  }
}
function callPeer(id){
  const call=peer.call(id,sendStream,{metadata:{name:myName}});
  if(call)setupCall(call);
}
function setupCall(call){
  const p=getPart(call.peer,call.metadata&&call.metadata.name);
  p.call=call;
  call.on('stream',s=>{
    if(p.stream!==s){p.stream=s;p.video.srcObject=s;watch(p.id,s)}
    p.video.play().catch(()=>{});
    setTimeout(tuneBitrate,1500);
  });
  call.on('close',()=>removePart(call.peer));
  call.on('error',()=>{});
}
function removePart(id){
  const p=parts.get(id);if(!p)return;
  parts.delete(id);
  try{p.call&&p.call.close()}catch(e){}
  try{p.conn&&p.conn.close()}catch(e){}
  if(p.tile)p.tile.remove();
  analysers.delete(id);
  if(pinned===id){pinned=null;autoPinned=false}
  updateCount();layout();
  if(joined)toast((p.name||'Someone')+' left');
  tuneBitrate();
}
function updateCount(){$('#count').textContent=parts.size+1}

/* ---------- bitrate tuning (mesh with many peers) ---------- */
function tuneBitrate(){
  const n=parts.size+1;
  const max=state.sharing?1500000:n<=3?1200000:n<=6?600000:n<=8?350000:250000;
  parts.forEach(p=>{
    const pc=p.call&&p.call.peerConnection;if(!pc)return;
    pc.getSenders().forEach(s=>{
      if(!s.track||s.track.kind!=='video')return;
      try{
        const prm=s.getParameters();
        if(!prm.encodings||!prm.encodings.length)prm.encodings=[{}];
        prm.encodings[0].maxBitrate=max;
        s.setParameters(prm).catch(()=>{});
      }catch(e){}
    });
  });
}

/* ---------- tiles & layout ---------- */
function makeTile(p,local){
  const t=document.createElement('div');t.className='tile';
  t.innerHTML='<video autoplay playsinline></video><div class="avatar"><span></span></div><div class="label"><span class="mic">🔇</span><span class="nm"></span></div><div class="badge">Presenting</div><div class="pinicon">📌</div>';
  p.tile=t;p.video=t.querySelector('video');p.local=!!local;
  if(local)p.video.muted=true;
  t.addEventListener('click',()=>{pinned=(pinned===p.id)?null:p.id;autoPinned=false;layout()});
  t.addEventListener('dblclick',()=>{if(t.requestFullscreen)t.requestFullscreen().catch(()=>{})});
  updateTile(p);layout();
}
function updateTile(p){
  const t=p.tile;if(!t)return;
  t.classList.toggle('muted',!p.mic);
  t.classList.toggle('nocam',!p.sharing&&!p.cam);
  t.classList.toggle('screen',!!p.sharing);
  t.classList.toggle('mirror',!!p.local&&!p.sharing);
  t.querySelector('.nm').textContent=(p.name||'Guest')+(p.local?' (You)':'');
  t.querySelector('.avatar span').textContent=(p.name||'?').trim().charAt(0)||'?';
}
function layout(){
  const grid=$('#grid'),pin=$('#pinArea'),stage=$('#stage');
  if(pinned&&pinned!=='me'&&!parts.has(pinned))pinned=null;
  const all=[me,...parts.values()].filter(p=>p.tile);
  all.forEach(p=>{
    const isPin=pinned===p.id;
    p.tile.classList.toggle('pinned',isPin);
    const dest=isPin?pin:grid;
    if(p.tile.parentNode!==dest){dest.appendChild(p.tile);p.video.play().catch(()=>{})}
  });
  stage.classList.toggle('has-pin',!!pinned);
  if(pinned){grid.style.gridTemplateColumns='';grid.style.gridTemplateRows='';return}
  const n=Math.max(1,grid.children.length);
  const portrait=grid.clientWidth<grid.clientHeight;
  let cols,rows;
  if(portrait){rows=Math.ceil(Math.sqrt(n));cols=Math.ceil(n/rows)}
  else{cols=Math.ceil(Math.sqrt(n));rows=Math.ceil(n/cols)}
  grid.style.gridTemplateColumns='repeat('+cols+',minmax(0,1fr))';
  grid.style.gridTemplateRows='repeat('+rows+',minmax(0,1fr))';
}
window.addEventListener('resize',layout);

/* ---------- active speaker ---------- */
let ac=null;const analysers=new Map();
function watch(id,stream){
  try{
    if(!stream.getAudioTracks().length)return;
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const src=ac.createMediaStreamSource(stream);
    const an=ac.createAnalyser();an.fftSize=512;src.connect(an);
    analysers.set(id,{an,buf:new Uint8Array(an.fftSize)});
  }catch(e){}
}
setInterval(()=>{
  analysers.forEach((a,id)=>{
    const p=id==='me'?me:parts.get(id);if(!p||!p.tile)return;
    a.an.getByteTimeDomainData(a.buf);
    let s=0;for(let i=0;i<a.buf.length;i++){const x=(a.buf[i]-128)/128;s+=x*x}
    p.tile.classList.toggle('speaking',Math.sqrt(s/a.buf.length)>0.03&&p.mic);
  });
},200);

/* ---------- room UI ---------- */
let timerStart=0;
function showRoom(){
  $('#lobby').hidden=true;$('#room').hidden=false;
  $('#roomCode').textContent=roomCode;
  history.replaceState(null,'','#'+roomCode);
  if(!me.tile){makeTile(me,true)}
  me.name=myName;syncButtons();
  me.video.srcObject=new MediaStream([camTrack]);
  if(hasMic)watch('me',new MediaStream([micTrack]));
  timerStart=Date.now();
  setInterval(()=>{const s=Math.floor((Date.now()-timerStart)/1000);$('#timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);
  layout();updateCount();
  if(isHost)toast('Room created – share the code '+roomCode);
}
function copy(text,msg){
  (navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(()=>toast(msg)).catch(()=>{
    const i=document.createElement('input');i.value=text;document.body.appendChild(i);i.select();
    try{document.execCommand('copy');toast(msg)}catch(e){toast('Copy failed – '+text)}i.remove();
  });
}
$('#copyCode').onclick=()=>copy(roomCode,'Room code copied');
$('#copyLink').onclick=()=>copy(location.href.split('#')[0]+'#'+roomCode,'Invite link copied');

/* ---------- screen share ---------- */
function replaceVideoTrack(track){
  const old=sendStream.getVideoTracks()[0];
  if(old)sendStream.removeTrack(old);
  sendStream.addTrack(track);
  parts.forEach(p=>{
    const pc=p.call&&p.call.peerConnection;if(!pc)return;
    const s=pc.getSenders().find(x=>x.track&&x.track.kind==='video');
    if(s)s.replaceTrack(track).catch(()=>{});
  });
  me.video.srcObject=new MediaStream([track]);
}
async function startShare(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia){toast('Screen sharing is not supported on this device/browser.');return}
  try{
    const s=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:{ideal:15,max:30}},audio:false});
    screenTrack=s.getVideoTracks()[0];
    screenTrack.onended=stopShare;
    replaceVideoTrack(screenTrack);
    state.sharing=true;syncButtons();broadcast(hello());tuneBitrate();
  }catch(e){if(e&&e.name!=='NotAllowedError')toast('Could not start screen share.')}
}
function stopShare(){
  if(!state.sharing)return;
  try{screenTrack&&screenTrack.stop()}catch(e){}
  screenTrack=null;
  replaceVideoTrack(camTrack);
  state.sharing=false;syncButtons();broadcast(hello());tuneBitrate();
}
$('#btnShare').onclick=()=>state.sharing?stopShare():startShare();

/* ---------- chat ---------- */
let unread=0;
function addChat(who,text,mine){
  const d=document.createElement('div');d.className='msg'+(mine?' me':'');
  const b=document.createElement('b');b.textContent=mine?'You':who;
  const s=document.createElement('span');s.textContent=text;
  d.append(b,s);$('#msgs').appendChild(d);$('#msgs').scrollTop=1e9;
  if(!mine&&$('#chat').hidden){unread++;const u=$('#unread');u.textContent=unread;u.style.display='flex'}
}
function toggleChat(){
  const c=$('#chat');c.hidden=!c.hidden;
  $('#ctlChat').classList.toggle('on',!c.hidden);
  if(!c.hidden){unread=0;$('#unread').style.display='none';$('#chatInput').focus()}
  setTimeout(layout,50);
}
$('#btnChat').onclick=toggleChat;$('#closeChat').onclick=toggleChat;
$('#chatForm').onsubmit=e=>{
  e.preventDefault();
  const v=$('#chatInput').value.trim();if(!v)return;
  broadcast({type:'chat',text:v});addChat('You',v,true);$('#chatInput').value='';
};

/* ---------- leave ---------- */
function leave(){
  try{parts.forEach(p=>{try{p.call&&p.call.close()}catch(e){};try{p.conn&&p.conn.close()}catch(e){}})}catch(e){}
  try{peer&&peer.destroy()}catch(e){}
  [camTrack,micTrack,screenTrack].forEach(t=>{try{t&&t.stop()}catch(e){}});
  location.href=location.href.split('#')[0];
}
$('#btnLeave').onclick=leave;
window.addEventListener('beforeunload',()=>{try{peer&&peer.destroy()}catch(e){}});

/* ---------- boot ---------- */
makeTile(me,true);
initMedia();
})();
</script>
</body>
</html>
